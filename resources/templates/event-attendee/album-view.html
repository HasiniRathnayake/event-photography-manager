<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${album.albumName + ' - Event Photography'}">Album Name - Event Photography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .dashboard-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .page-header {
            color: white;
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
        }
        .album-info-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .photo-item {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .photo-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        .photo-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .photo-info {
            padding: 1rem;
        }
    </style>
</head>
<body>
<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-person me-2"></i>Event Photography Attendee
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/attendee/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/attendee/photos}">
                        <i class="bi bi-images me-1"></i>Photos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/auth/logout}">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <!-- Page Header -->
    <div class="page-header">
        <h1><i class="bi bi-collection me-3"></i><span th:text="${album.albumName}">Album Name</span></h1>
        <p class="text-white">View and download photos from this album</p>
    </div>

    <!-- Main Container -->
    <div class="dashboard-container">
        <!-- Album Info -->
        <div class="album-info-card">
            <div class="row">
                <div class="col-md-8">
                    <h3 th:text="${album.albumName}">Album Name</h3>
                    <p class="text-muted" th:text="${album.description ?: 'No description provided'}">Album Description</p>
                    <div class="d-flex gap-3">
                        <div>
                            <small class="text-muted">Event</small>
                            <div th:text="${album.event.eventName}">Event Name</div>
                        </div>
                        <div>
                            <small class="text-muted">Date</small>
                            <div th:text="${#temporals.format(album.createdDate, 'MMM dd, yyyy')}">Created Date</div>
                        </div>
                        <div>
                            <small class="text-muted">Photos</small>
                            <div th:text="${#lists.size(photos)}">Photo Count</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 text-end">
                    <a th:href="@{/attendee/photos}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Back to Albums
                    </a>
                </div>
            </div>
        </div>

        <!-- Photos Grid -->
        <div th:if="${!#lists.isEmpty(photos)}" class="photo-grid">
            <div th:each="photo : ${photos}" class="photo-item">
                <img th:src="@{'/attendee/photos/' + ${photo.photoID} + '/preview'}" class="photo-img" alt="Event Photo">
                <div class="photo-info">
                    <div class="d-grid gap-2">
                        <a th:href="@{'/attendee/photos/' + ${photo.photoID} + '/download'}" class="btn btn-primary">
                            <i class="bi bi-download me-1"></i>Download Photo
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <div th:if="${#lists.isEmpty(photos)}" class="text-center py-5">
            <div class="text-white">
                <i class="bi bi-image" style="font-size: 3rem;"></i>
                <h4 class="mt-3">No Photos in Album</h4>
                <p class="text-white-50">This album doesn't contain any photos yet.</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
