<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Equipment List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Equipment List</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="equipment : ${equipmentList}">
                <td th:text="${equipment.name}">Name</td>
                <td th:text="${equipment.category}">Category</td>
                <td th:text="${equipment.status}">Status</td>
                <td>
                    <a th:href="@{/equipment/edit/{id}(id=${equipment.equipmentID})}" class="btn btn-primary btn-sm">Edit</a>
                    <form th:action="@{/equipment/delete/{id}(id=${equipment.equipmentID})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/equipment/create}" class="btn btn-success">Add Equipment</a>
</div>
</body>
</html>
