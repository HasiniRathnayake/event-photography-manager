<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Package List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Package List</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="pkg : ${packageList}">
                <td th:text="${pkg.name}">Name</td>
                <td th:text="${pkg.price}">Price</td>
                <td th:text="${pkg.status}">Status</td>
                <td>
                    <a th:href="@{/packages/edit/{id}(id=${pkg.packageID})}" class="btn btn-primary btn-sm">Edit</a>
                    <form th:action="@{/packages/delete/{id}(id=${pkg.packageID})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/packages/create}" class="btn btn-success">Add Package</a>
</div>
</body>
</html>
