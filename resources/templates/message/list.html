<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Messages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Messages</h2>
    <ul class="nav nav-tabs" id="messageTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="received-tab" data-bs-toggle="tab" data-bs-target="#received" type="button">Received</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="sent-tab" data-bs-toggle="tab" data-bs-target="#sent" type="button">Sent</button>
        </li>
    </ul>
    <div class="tab-content" id="messageTabsContent">
        <div class="tab-pane fade show active" id="received" role="tabpanel">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>From</th>
                        <th>Subject</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="message : ${receivedMessages}">
                        <td th:text="${message.sender.name}">Sender</td>
                        <td th:text="${message.subject}">Subject</td>
                        <td th:text="${#temporals.format(message.sentDate, 'MMM dd, yyyy HH:mm')}">Date</td>
                        <td>
                            <a th:href="@{/messages/view/{id}(id=${message.messageID})}" class="btn btn-primary btn-sm">View</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="tab-pane fade" id="sent" role="tabpanel">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>To</th>
                        <th>Subject</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="message : ${sentMessages}">
                        <td th:text="${message.receiver.name}">Receiver</td>
                        <td th:text="${message.subject}">Subject</td>
                        <td th:text="${#temporals.format(message.sentDate, 'MMM dd, yyyy HH:mm')}">Date</td>
                        <td>
                            <a th:href="@{/messages/view/{id}(id=${message.messageID})}" class="btn btn-primary btn-sm">View</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <a th:href="@{/messages/compose}" class="btn btn-success">Compose Message</a>
</div>
</body>
</html>
