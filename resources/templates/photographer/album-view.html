<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${album.albumName + ' - Album View'}">Album View - Event Photography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .dashboard-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .page-header {
            color: white;
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .photo-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        .photo-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .photo-info {
            padding: 1rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-camera me-2"></i>Event Photography Photographer
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/photographer/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/photographer/events}">
                        <i class="bi bi-calendar-event me-1"></i>Events
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/photographer/albums}">
                        <i class="bi bi-collection me-1"></i>Albums
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/photographer/profile}">
                        <i class="bi bi-person me-1"></i>Profile
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <!-- Page Header -->
    <div class="page-header">
        <h1><i class="bi bi-images me-3"></i><span th:text="${album.albumName}">Album Name</span></h1>
        <p class="text-white" th:text="${album.event.eventName}">Event Name</p>
    </div>

    <!-- Main Container -->
    <div class="dashboard-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="text-white">Photos in this Album</h4>
                <p class="text-white-50" th:text="${#lists.size(photos) + ' photos'}">0 photos</p>
            </div>
            <div>
                <button class="btn btn-primary" th:onclick="|openUploadModal(${album.albumID})|">
                    <i class="bi bi-plus-circle me-2"></i>Add More Photos
                </button>
                <a th:href="@{/photographer/albums}" class="btn btn-outline-light ms-2">
                    <i class="bi bi-arrow-left me-2"></i>Back to Albums
                </a>
            </div>
        </div>

        <!-- Photo Grid -->
        <div class="photo-grid">
            <div class="photo-card" th:each="photo : ${photos}" th:if="${photos != null}">
                <img th:src="@{'/uploads/photos/' + ${photo.fileName}}" class="photo-img" alt="Photo">
                <div class="photo-info">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted small" th:text="${#temporals.format(photo.uploadedDate, 'MMM dd, yyyy')}">Upload Date</span>
                        <div class="btn-group btn-group-sm" role="group">
                            <button class="btn btn-outline-primary" th:onclick="|setCoverPhoto(${album.albumID}, ${photo.photoID})|" title="Set as Cover">
                                <i class="bi bi-bookmark-star"></i>
                            </button>
                            <button class="btn btn-outline-danger" th:onclick="|deletePhoto(${photo.photoID})|" title="Delete">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(photos)}" class="col-12 text-center py-5">
                <div class="text-white">
                    <i class="bi bi-image" style="font-size: 3rem;"></i>
                    <h4 class="mt-3">No Photos in This Album</h4>
                    <p class="text-white-50">Upload some photos to get started.</p>
                    <button class="btn btn-primary" th:onclick="|openUploadModal(${album.albumID})|">
                        <i class="bi bi-plus-circle me-2"></i>Upload Photos
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Photo Upload Modal -->
<div class="modal fade" id="uploadPhotoModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-image me-2"></i>Upload Photos</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/photographer/photos/upload}" method="post" enctype="multipart/form-data">
                <div class="modal-body">
                    <input type="hidden" id="uploadAlbumId" name="albumId" th:value="${album.albumID}">
                    <div class="mb-3">
                        <label for="photoFile" class="form-label">Select Photos</label>
                        <input type="file" class="form-control" id="photoFile" name="photoFile" multiple accept="image/*" required>
                        <div class="form-text">Select one or more photos to upload (JPG, PNG, GIF)</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Upload Photos</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Function to set album ID when opening upload modal
    function openUploadModal(albumId) {
        document.getElementById('uploadAlbumId').value = albumId;
        var uploadModal = new bootstrap.Modal(document.getElementById('uploadPhotoModal'));
        uploadModal.show();
    }

    // Function to set cover photo
    function setCoverPhoto(albumId, photoId) {
        if (confirm("Set this photo as the album cover?")) {
            // Create a form to submit the request
            var form = document.createElement('form');
            form.method = 'POST';
            form.action = '/photographer/albums/' + albumId + '/set-cover';
            
            var photoIdInput = document.createElement('input');
            photoIdInput.type = 'hidden';
            photoIdInput.name = 'photoId';
            photoIdInput.value = photoId;
            form.appendChild(photoIdInput);
            
            var csrfInput = document.createElement('input');
            csrfInput.type = 'hidden';
            csrfInput.name = '_csrf';
            // You might need to get the CSRF token from your page
            form.appendChild(csrfInput);
            
            document.body.appendChild(form);
            form.submit();
        }
    }

    // Function to delete photo
    function deletePhoto(photoId) {
        if (confirm("Are you sure you want to delete this photo?")) {
            // Create a form to submit the request
            var form = document.createElement('form');
            form.method = 'POST';
            form.action = '/photographer/photos/' + photoId + '/delete';
            
            var methodInput = document.createElement('input');
            methodInput.type = 'hidden';
            methodInput.name = '_method';
            methodInput.value = 'DELETE';
            form.appendChild(methodInput);
            
            var csrfInput = document.createElement('input');
            csrfInput.type = 'hidden';
            csrfInput.name = '_csrf';
            // You might need to get the CSRF token from your page
            form.appendChild(csrfInput);
            
            document.body.appendChild(form);
            form.submit();
        }
    }
</script>
</body>
</html>
