<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Event Photography Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .portfolio-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem auto;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .portfolio-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        .portfolio-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-camera-fill me-2"></i>Photographer Portfolio
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/photographer/profile}">
                <i class="bi bi-person me-1"></i>Profile
            </a>
            <a class="nav-link" th:href="@{/photographer/dashboard}">
                <i class="bi bi-speedometer2 me-1"></i>Dashboard
            </a>
            <a class="nav-link" th:href="@{/auth/logout}">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
            </a>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <!-- Page Header -->
    <div class="text-center mb-4">
        <h1 class="text-white"><i class="bi bi-images me-3"></i>Portfolio Gallery</h1>
        <p class="text-white">View all uploaded portfolio images</p>
    </div>

    <!-- Main Container -->
    <div class="portfolio-container">
        <div th:if="${portfolioImages == null or #arrays.isEmpty(portfolioImages)}" class="text-center">
            <i class="bi bi-images display-4 text-muted"></i>
            <h3 class="mt-3">No Portfolio Images</h3>
            <p class="text-muted">You haven't uploaded any portfolio images yet.</p>
            <a th:href="@{/photographer/profile}" class="btn btn-primary">
                <i class="bi bi-upload me-2"></i>Upload Images
            </a>
        </div>
        
        <div th:unless="${portfolioImages == null or #arrays.isEmpty(portfolioImages)}" class="row">
            <div th:each="imagePath : ${portfolioImages}" class="col-md-4 mb-4">
                <div class="portfolio-card">
                    <img th:src="@{'/' + ${imagePath}}" alt="Portfolio Image" class="portfolio-image">
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
