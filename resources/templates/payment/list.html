<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Payment List</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Invoice ID</th>
                <th>Amount</th>
                <th>Payment Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="payment : ${paymentList}">
                <td th:text="${payment.invoice.invoiceID}">Invoice ID</td>
                <td th:text="${payment.amount}">Amount</td>
                <td th:text="${#temporals.format(payment.paymentDate, 'MMM dd, yyyy')}">Date</td>
                <td th:text="${payment.status}">Status</td>
                <td>
                    <a th:href="@{/payments/edit/{id}(id=${payment.paymentID})}" class="btn btn-primary btn-sm">Edit</a>
                    <form th:action="@{/payments/delete/{id}(id=${payment.paymentID})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
