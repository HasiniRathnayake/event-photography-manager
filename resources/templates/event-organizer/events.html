<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events - Event Photography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .dashboard-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .table-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .page-header {
            color: white;
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
        }
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-pending { background-color: #fff3cd; color: #856404; }
        .badge-confirmed { background-color: #d1ecf1; color: #0c5460; }
        .badge-completed { background-color: #d4edda; color: #155724; }
        .badge-cancelled { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-briefcase me-2"></i>Event Photography Organizer
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/event-organizer/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/event-organizer/events}">
                        <i class="bi bi-calendar-event me-1"></i>Events
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/event-organizer/bookings}">
                        <i class="bi bi-book me-1"></i>Bookings
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/notifications}">
                        <i class="bi bi-bell me-1"></i>Notifications
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/auth/logout}">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <!-- Page Header -->
    <div class="page-header">
        <h1><i class="bi bi-calendar-event me-3"></i>Manage Events</h1>
        <p class="text-white">Create and manage your events</p>
    </div>

    <!-- Main Container -->
    <div class="dashboard-container">
        <!-- Search and Filter -->
        <div class="row mb-4">
            <div class="col-md-6">
                <form th:action="@{/event-organizer/events}" method="get">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" name="search" placeholder="Search events..." th:value="${searchQuery}">
                        <button class="btn btn-outline-secondary" type="submit">Search</button>
                    </div>
                </form>
            </div>
            <div class="col-md-6 text-end">
                <a th:href="@{/event-organizer/events/new}" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-2"></i>New Event
                </a>
                <a th:href="@{/event-organizer/events(sort='date')}" class="btn btn-secondary ms-2">
                    <i class="bi bi-sort-down me-2"></i>Sort by Date
                </a>
            </div>
        </div>

        <!-- Events Table -->
        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Event ID</th>
                            <th>Event Name</th>
                            <th>Date</th>
                            <th>Venue</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="event : ${events}">
                            <td th:text="${event.eventID}">1</td>
                            <td th:text="${event.eventName}">Event Name</td>
                            <td th:text="${#temporals.format(event.date, 'MMM dd, yyyy')}">Date</td>
                            <td th:text="${event.venue}">Venue</td>
                            <td>
                                <span class="status-badge"
                                      th:class="'status-badge ' + (${event.status == 'Pending'} ? 'badge-pending' : 
                                      (${event.status == 'Confirmed'} ? 'badge-confirmed' : 
                                      (${event.status == 'Completed'} ? 'badge-completed' : 'badge-cancelled')))"
                                      th:text="${event.status}">
                                    Status
                                </span>
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm" role="group">
                                    <a th:href="@{'/event-organizer/events/' + ${event.eventID}}" class="btn btn-outline-primary" title="View Details">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{'/event-organizer/events/' + ${event.eventID} + '/edit'}" class="btn btn-outline-success" title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{'/event-organizer/events/' + ${event.eventID} + '/assign-photographer'}" class="btn btn-outline-info" title="Book Photographer">
                                        <i class="bi bi-camera"></i>
                                    </a>
                                    <form th:if="${event.status == 'Confirmed'}" th:action="@{'/event-organizer/events/' + ${event.eventID} + '/complete'}" method="post" style="display: inline;">
                                        <button type="submit" class="btn btn-outline-success" title="Mark as Completed">
                                            <i class="bi bi-check-circle"></i>
                                        </button>
                                    </form>
                                    <a th:href="@{'/event-organizer/events/' + ${event.eventID} + '/cancel'}" class="btn btn-outline-warning" title="Cancel Event">
                                        <i class="bi bi-x-circle"></i>
                                    </a>
                                    <form th:action="@{'/event-organizer/events/' + ${event.eventID} + '/delete'}" method="post" style="display: inline;">
                                        <button type="submit" class="btn btn-outline-danger" title="Delete Event" onclick="return confirm('Are you sure you want to delete this event and all associated bookings?')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(events)}">
                            <td colspan="6" class="text-center text-muted py-4">
                                <i class="bi bi-calendar-x me-2" style="font-size: 2rem;"></i>
                                <div>No events found</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <nav aria-label="Events pagination" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item disabled">
                        <a class="page-link" href="#" tabindex="-1">Previous</a>
                    </li>
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item">
                        <a class="page-link" href="#">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
