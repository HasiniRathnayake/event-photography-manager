<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Dashboard - Event Photography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .dashboard-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .stats-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .stat-card {
            text-align: center;
            padding: 1rem;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #667eea;
        }
        .stat-label {
            color: #6c757d;
            font-weight: 500;
        }
        .page-header {
            color: white;
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
        }
        .event-card {
            background: white;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid #28a745;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-briefcase me-2"></i>Event Photography Organizer
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/event-organizer/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/event-organizer/events}">
                        <i class="bi bi-calendar-event me-1"></i>Events
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/event-organizer/bookings}">
                        <i class="bi bi-book me-1"></i>Bookings
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/notifications}">
                        <i class="bi bi-bell me-1"></i>Notifications
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/auth/logout}">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <!-- Flash Messages -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <!-- Page Header -->
    <div class="page-header">
        <h1><i class="bi bi-speedometer2 me-3"></i>Organizer Dashboard</h1>
        <p class="text-white">Manage your events and bookings</p>
    </div>

    <!-- Main Container -->
    <div class="dashboard-container">
        <!-- Statistics -->
        <div class="stats-container">
            <div class="row text-center">
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-number" th:text="${#lists.size(events)}">0</div>
                        <div class="stat-label">Total Events</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-number" th:text="${activeBookingsCount ?: 0}">0</div>
                        <div class="stat-label">Active Bookings</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <div class="stat-number" th:text="${pendingActionsCount ?: 0}">0</div>
                        <div class="stat-label">Pending Actions</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Recent Events -->
            <div class="col-md-6">
                <div class="stats-container">
                    <h4><i class="bi bi-calendar-event me-2"></i>Recent Events</h4>
                    <div th:if="${#lists.isEmpty(events)}" class="text-center text-muted">
                        <i class="bi bi-calendar-x display-4"></i>
                        <p class="mt-2">No events found</p>
                    </div>
                    <div th:each="event : ${events}" class="event-card">
                        <h6 th:text="${event.eventName}">Event Name</h6>
                        <p class="mb-1"><i class="bi bi-calendar me-2"></i><span th:text="${event.date}">Date</span></p>
                        <p class="mb-1"><i class="bi bi-geo-alt me-2"></i><span th:text="${event.venue}">Venue</span></p>
                        <p class="mb-0"><i class="bi bi-info-circle me-2"></i><span th:text="${event.status}">Status</span></p>
                    </div>
                </div>
            </div>

            <!-- Create New Event -->
            <div class="col-md-6">
                <div class="form-container">
                    <h4><i class="bi bi-plus-circle me-2"></i>Create New Event</h4>
                    <form th:action="@{/event-organizer/events/create}" method="post" th:object="${newEvent}">
                        <div class="mb-3">
                            <label for="eventName" class="form-label">Event Name</label>
                            <input type="text" class="form-control" id="eventName" name="eventName" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventType" class="form-label">Event Type</label>
                            <select class="form-select" id="eventType" name="eventType" required>
                                <option value="">Select Event Type</option>
                                <option value="Wedding">Wedding</option>
                                <option value="Corporate">Corporate</option>
                                <option value="Birthday">Birthday</option>
                                <option value="Conference">Conference</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="date" class="form-label">Event Date</label>
                            <input type="date" class="form-control" id="date" name="date" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="startTime" class="form-label">Start Time</label>
                                <input type="time" class="form-control" id="startTime" name="startTime" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="endTime" class="form-label">End Time</label>
                                <input type="time" class="form-control" id="endTime" name="endTime" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="venue" class="form-label">Venue</label>
                            <input type="text" class="form-control" id="venue" name="venue" required>
                        </div>
                        <div class="mb-3">
                            <label for="expectedGuests" class="form-label">Expected Guests</label>
                            <input type="number" class="form-control" id="expectedGuests" name="expectedGuests" min="1" placeholder="e.g., 150">
                        </div>
                        <div class="mb-3">
                            <label for="specialRequirements" class="form-label">Special Requirements</label>
                            <textarea class="form-control" id="specialRequirements" name="specialRequirements" rows="2" placeholder="Any special requests or notes..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="budget" class="form-label">Estimated Budget (Optional)</label>
                            <input type="number" class="form-control" id="budget" name="budget" step="0.01" min="0" placeholder="Enter amount in Rs.">
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Create Event</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
