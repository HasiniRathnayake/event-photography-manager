<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Booking - Event Photography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .dashboard-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .page-header {
            color: white;
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
        }
        .form-label {
            font-weight: 600;
            color: #495057;
        }
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-pending { background-color: #fff3cd; color: #856404; }
        .badge-confirmed { background-color: #d1ecf1; color: #0c5460; }
        .badge-completed { background-color: #d4edda; color: #155724; }
        .badge-cancelled { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-briefcase me-2"></i>Event Photography Organizer
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/event-organizer/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/event-organizer/events}">
                        <i class="bi bi-calendar-event me-1"></i>Events
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/event-organizer/bookings}">
                        <i class="bi bi-book me-1"></i>Bookings
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/notifications}">
                        <i class="bi bi-bell me-1"></i>Notifications
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/auth/logout}">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <!-- Page Header -->
    <div class="page-header">
        <h1><i class="bi bi-book me-3"></i>Edit Booking</h1>
        <p class="text-white">Update booking details</p>
    </div>

    <!-- Main Container -->
    <div class="dashboard-container">
        <div class="form-container">
            <form th:action="@{'/event-organizer/bookings/' + ${booking.bookingID} + '/update'}" method="post">
                <input type="hidden" th:field="*{booking.bookingID}" />
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Booking ID</label>
                            <input type="text" class="form-control" th:value="${booking.bookingID}" disabled>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Event</label>
                            <select class="form-select" name="eventId" required>
                                <option value="">Select Event</option>
                                <option th:each="event : ${events}" 
                                        th:value="${event.eventID}" 
                                        th:text="${event.eventName}"
                                        th:selected="${event.eventID == booking.event?.eventID}">
                                </option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Photographer</label>
                            <select class="form-select" name="photographerId" required>
                                <option value="">Select Photographer</option>
                                <option th:each="photographer : ${photographers}" 
                                        th:value="${photographer.photographerID}" 
                                        th:text="${photographer.user?.name}"
                                        th:selected="${photographer.photographerID == booking.photographer?.photographerID}">
                                </option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Booking Date</label>
                            <input type="text" class="form-control" th:value="${#temporals.format(booking.bookingDate, 'MMM dd, yyyy HH:mm')}" disabled>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" th:field="*{booking.status}" required>
                                <option value="Pending">Pending</option>
                                <option value="Confirmed">Confirmed</option>
                                <option value="Completed">Completed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Total Amount (Rs.)</label>
                            <input type="number" class="form-control" th:field="*{booking.totalAmount}" step="0.01" min="0" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Advance Payment (Rs.)</label>
                            <input type="number" class="form-control" th:field="*{booking.advancePayment}" step="0.01" min="0">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control" th:field="*{booking.notes}" rows="3"></textarea>
                        </div>
                    </div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                    <a th:href="@{/event-organizer/bookings}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-2"></i>Update Booking
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
