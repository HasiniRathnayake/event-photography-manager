<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Event Photography Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .welcome-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 3rem;
            margin: 2rem auto;
            max-width: 800px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
        }
        .welcome-header h1 {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .role-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
            transition: transform 0.3s ease;
        }
        .role-card:hover {
            transform: translateY(-5px);
        }
        .btn-role {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 1rem 2rem;
            font-weight: 600;
            color: white;
            text-decoration: none;
            display: inline-block;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-camera-fill me-2"></i>Event Photography
        </a>
        <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">
                    Welcome, <span th:text="${user.name}">User</span>!
                </span>
            <a class="nav-link" th:href="@{/auth/logout}">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
            </a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="welcome-container">
        <div class="welcome-header">
            <h1><i class="bi bi-speedometer2 me-3"></i>Welcome to Your Dashboard</h1>
            <p class="lead">You are logged in as: <strong th:text="${userType}">Role</strong></p>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="role-card">
                    <i class="bi bi-person-badge display-4 text-primary mb-3"></i>
                    <h4>Your Profile</h4>
                    <p>Manage your personal information and account settings</p>
                    <a th:href="@{'/' + ${userType.toLowerCase().replace(' ', '-')} + '/profile'}" class="btn-role">
                        View Profile
                    </a>
                </div>
            </div>
            <div class="col-md-6">
                <div class="role-card">
                    <i class="bi bi-bell display-4 text-warning mb-3"></i>
                    <h4>Notifications</h4>
                    <p>Check your latest notifications and updates</p>
                    <a th:href="@{'/' + ${userType.toLowerCase().replace(' ', '-')} + '/notifications'}" class="btn-role">
                        View Notifications
                    </a>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <h4>Quick Access</h4>
            <div class="d-grid gap-2 d-md-block">
                <a th:href="@{'/' + ${userType.toLowerCase().replace(' ', '-')} + '/dashboard'}" class="btn btn-primary btn-lg">
                    <i class="bi bi-house me-2"></i>Go to Main Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
