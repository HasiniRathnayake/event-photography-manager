<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Review List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Review List</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Photographer</th>
                <th>Rating</th>
                <th>Comment</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="review : ${reviewList}">
                <td th:text="${review.photographer.user.name}">Photographer</td>
                <td th:text="${review.rating}">Rating</td>
                <td th:text="${review.comment}">Comment</td>
                <td th:text="${#temporals.format(review.reviewDate, 'MMM dd, yyyy')}">Date</td>
                <td th:text="${review.status}">Status</td>
                <td>
                    <a th:href="@{/reviews/edit/{id}(id=${review.reviewID})}" class="btn btn-primary btn-sm">Edit</a>
                    <form th:action="@{/reviews/delete/{id}(id=${review.reviewID})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
