<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Event Photography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .dashboard-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .notification-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .notification-unread {
            border-left: 4px solid #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        .notification-read {
            border-left: 4px solid #6c757d;
        }
        .page-header {
            color: white;
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
        }
        .notification-icon {
            font-size: 1.5rem;
            margin-right: 1rem;
        }
        .notification-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-booking { background-color: #cce5ff; color: #004085; }
        .badge-payment { background-color: #d4edda; color: #155724; }
        .badge-event { background-color: #fff3cd; color: #856404; }
        .badge-support { background-color: #f8d7da; color: #721c24; }
        .badge-system { background-color: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>
<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-bell me-2"></i>Event Photography Notifications
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/notifications}">
                        <i class="bi bi-bell me-1"></i>Notifications
                        <span th:if="${unreadCount > 0}" class="badge bg-danger ms-1" th:text="${unreadCount}">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <!-- Page Header -->
    <div class="page-header">
        <h1><i class="bi bi-bell me-3"></i>Notifications</h1>
        <p class="text-white">Stay updated with all your notifications</p>
    </div>

    <!-- Main Container -->
    <div class="dashboard-container">
        <!-- Action Buttons -->
        <div class="row mb-4">
            <div class="col-md-12 text-end">
                <form th:action="@{/notifications/mark-all-as-read}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-all me-2"></i>Mark All as Read
                    </button>
                </form>
            </div>
        </div>

        <!-- Notifications List -->
        <div th:if="${#lists.isEmpty(notifications)}" class="text-center text-white py-5">
            <i class="bi bi-bell-slash display-4"></i>
            <h3 class="mt-3">No notifications</h3>
            <p>You're all caught up! Check back later for new notifications.</p>
        </div>

        <div th:each="notification : ${notifications}" 
             th:class="'notification-container ' + (notification.isRead ? 'notification-read' : 'notification-unread')">
            <div class="d-flex justify-content-between align-items-start">
                <div class="d-flex align-items-start flex-grow-1">
                    <div>
                        <i th:if="${notification.type == 'Booking'}" class="bi bi-calendar-check notification-icon text-primary"></i>
                        <i th:if="${notification.type == 'Payment'}" class="bi bi-currency-dollar notification-icon text-success"></i>
                        <i th:if="${notification.type == 'Event'}" class="bi bi-calendar-event notification-icon text-warning"></i>
                        <i th:if="${notification.type == 'Support'}" class="bi bi-headset notification-icon text-danger"></i>
                        <i th:if="${notification.type == 'System'}" class="bi bi-gear notification-icon text-secondary"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between">
                            <h5 th:text="${notification.title}" class="mb-1">Notification Title</h5>
                            <span class="notification-badge"
                                  th:class="'notification-badge ' + (${notification.type == 'Booking'} ? 'badge-booking' : 
                                  (${notification.type == 'Payment'} ? 'badge-payment' : 
                                  (${notification.type == 'Event'} ? 'badge-event' : 
                                  (${notification.type == 'Support'} ? 'badge-support' : 'badge-system'))))"
                                  th:text="${notification.type}">
                                Type
                            </span>
                        </div>
                        <p th:text="${notification.message}" class="mb-2">Notification message...</p>
                        <small class="text-muted" th:text="${#temporals.format(notification.createdDate, 'MMM dd, yyyy HH:mm')}">Date</small>
                    </div>
                </div>
                <div th:if="${!notification.isRead}" class="ms-3">
                    <form th:action="@{'/notifications/' + ${notification.notificationID} + '/mark-as-read'}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-check"></i> Mark as Read
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
